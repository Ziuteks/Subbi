name: SubscriptionTracker
options:
  bundleIdPrefix: pl.startup
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SubscriptionTracker:
    type: application
    platform: iOS
    sources:
      - path: SubscriptionTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.startup.SubscriptionTracker
        INFOPLIST_KEY_CFBundleDisplayName: Subscriptions
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
